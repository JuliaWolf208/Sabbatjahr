<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FAFAF8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Sabbatjahr">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Sabbatjahr</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    min-height: 100vh;
    background: #FAFAF8;
    font-family: 'Georgia', serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior: none;
  }
  body {
    padding: env(safe-area-inset-top) 1rem env(safe-area-inset-bottom);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding-top: max(env(safe-area-inset-top), 2rem);
  }
  .countdown {
    font-size: clamp(5rem, 18vw, 10rem);
    font-weight: 300;
    color: #111;
    line-height: 1;
    letter-spacing: -0.04em;
    margin-top: 2rem;
  }
  .label { font-size: 1rem; color: #555; margin-top: 0.5rem; letter-spacing: 0.05em; }
  .date  { font-size: 0.75rem; color: #aaa; margin-top: 0.25rem; margin-bottom: 2rem; }
  .calendars { display: flex; flex-wrap: wrap; gap: 2rem; justify-content: center; }
  .month { width: min(320px, 90vw); }
  .month-title {
    text-align: center; font-weight: 300; font-size: 1rem;
    letter-spacing: 0.1em; color: #555; margin-bottom: 0.75rem;
  }
  .grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 3px; }
  .dow { text-align: center; font-size: 0.6rem; color: #aaa; padding-bottom: 2px; }
  .day {
    border-radius: 5px; text-align: center; font-size: 0.75rem;
    padding: 5px 2px; user-select: none;
  }
  .day.work    { background: #fee2e2; color: #991b1b; }
  .day.free    { background: #dcfce7; color: #166534; }
  .day.halbfrei {
    background: repeating-linear-gradient(
      135deg,
      #dcfce7 0 8px,
      #fee2e2 8px 16px
    );
    color: #555;
  }
  .day.weekend { background: #f1f5f9; color: #c0c0c0; }
  .day.past    { background: #f1f5f9; color: #c0c0c0; }
  .day.future  { background: transparent; color: #d1d5db; }
  .day.today   { outline: 2px solid #111; outline-offset: -2px; font-weight: bold; }
  .legend {
    display: flex; gap: 1rem; margin: 1.5rem 0;
    flex-wrap: wrap; justify-content: center;
    font-size: 0.7rem; color: #666;
  }
  .legend > div { display: flex; align-items: center; gap: 0.4rem; }
  .swatch { width: 14px; height: 14px; border-radius: 3px; }
</style>
</head>
<body>
  <div class="countdown" id="count">–</div>
  <div class="label">Arbeitstage bis zum Sabbatjahr</div>
  <div class="date">26. Juni 2026</div>
  <div class="calendars" id="calendars"></div>
  <div class="legend">
    <div><div class="swatch" style="background:#fee2e2"></div>Arbeitstag</div>
    <div><div class="swatch" style="background:#dcfce7"></div>Frei / Feiertag</div>
    <div><div class="swatch" style="background:repeating-linear-gradient(135deg,#dcfce7 0 4px,#fee2e2 4px 8px)"></div>Halber Tag</div>
    <div><div class="swatch" style="background:#f1f5f9"></div>Vergangen / Wochenende</div>
  </div>

<script>
const SABBAT_START = new Date(2026, 5, 26);
const HOLIDAYS = new Set(["2026-05-01","2026-05-14","2026-05-25","2026-06-04"]);
const EXTRA_FREE = new Set(["2026-05-15","2026-06-05"]);
const HALBFREI = new Set(["2026-06-09","2026-06-10"]);
const MONTH_NAMES = ["Januar","Februar","März","April","Mai","Juni","Juli","August","September","Oktober","November","Dezember"];
const DOW = ["Mo","Di","Mi","Do","Fr","Sa","So"];

const today = () => { const d = new Date(); d.setHours(0,0,0,0); return d; };
const toISO = d => `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;

function classify(date) {
  const t = today();
  if (date > SABBAT_START) return "future";
  if (date < t) return "past";
  const dow = date.getDay();
  if (dow === 0 || dow === 6) return "weekend";
  if (dow === 1) return "free";
  const iso = toISO(date);
  if (HOLIDAYS.has(iso) || EXTRA_FREE.has(iso)) return "free";
  if (HALBFREI.has(iso)) return "halbfrei";
  return "work";
}

function countWorkdays() {
  let n = 0;
  let halbfreiSeen = 0;
  const cur = new Date(today());
  while (cur <= SABBAT_START) {
    const c = classify(cur);
    if (c === "work") n += 1;
    else if (c === "halbfrei") {
      halbfreiSeen++;
      if (halbfreiSeen % 2 === 1) n += 1; // jeder zweite zählt als ganzer Tag
    }
    cur.setDate(cur.getDate() + 1);
  }
  return n;
}

function renderMonth(year, month) {
  const first = new Date(year, month, 1);
  const last = new Date(year, month + 1, 0);
  let startDow = first.getDay(); startDow = startDow === 0 ? 6 : startDow - 1;
  const cells = [];
  for (let i = 0; i < startDow; i++) cells.push('<div></div>');
  const t = toISO(today());
  for (let d = 1; d <= last.getDate(); d++) {
    const date = new Date(year, month, d);
    const cls = classify(date);
    const isToday = toISO(date) === t ? " today" : "";
    cells.push(`<div class="day ${cls}${isToday}">${d}</div>`);
  }
  return `
    <div class="month">
      <div class="month-title">${MONTH_NAMES[month]} ${year}</div>
      <div class="grid">${DOW.map(l=>`<div class="dow">${l}</div>`).join("")}${cells.join("")}</div>
    </div>`;
}

document.getElementById("count").textContent = countWorkdays();
document.getElementById("calendars").innerHTML = renderMonth(2026, 4) + renderMonth(2026, 5);

if ("serviceWorker" in navigator) {
  navigator.serviceWorker.register("sw.js").catch(() => {});
}
</script>
</body>
</html>
